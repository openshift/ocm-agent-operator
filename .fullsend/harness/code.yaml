# .fullsend/harness/code.yaml
#
# Composes the upstream fullsend code harness (pinned to agents v0.38.0) and
# adds only the local dispatch trigger. v0.38.0 handles Jira natively: its
# `event.source.system == "jira"` overlay fetches the work item host-side in
# pre-code-jira.sh and injects it into the sandbox as a file, and sets
# ISSUE_URL / ISSUE_NUMBER / FULLSEND_TRACKER itself. No local env or policy
# overrides are needed (they were workarounds for the pre-v0.38.0 forge gap).
base: https://raw.githubusercontent.com/fullsend-ai/agents/48511880eaea5ef01f80b69ba4f228147611db33/harness/code.yaml#sha256=4f0d9425d5ee1fa86e21d3b6d1ac9bd086da2f59de9d80a311f753c00d99303d

trigger: >
  event.entity.kind == "work_item"
    && (
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-code")
      ||
      (event.transition.kind == "label_changed"
        && event.transition.label.name == "ready-to-code"
        && event.transition.label.action == "added")
    )

allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

# The v0.38.0 base maps CODE_ALLOWED_TARGET_BRANCHES from a host variable of
# the same name, but the Jira-poll dispatch path does not set it, so harness
# env validation fails. Override it with a literal: the code agent may only
# open PRs against master (this repo's default branch).
env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: master
